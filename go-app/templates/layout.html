{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - {{.AppName}}</title>
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
    {{if .CurrentUser}}
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/dashboard" class="text-xl font-bold text-gray-900">{{.AppName}}</a>
                    <div class="hidden md:flex ml-10 space-x-4">
                        <a href="/dashboard" class="text-gray-600 hover:text-gray-900 px-3 py-2 text-sm font-medium">Dashboard</a>
                        <a href="/dashboard/team" class="text-gray-600 hover:text-gray-900 px-3 py-2 text-sm font-medium">Team</a>
                        <a href="/pricing" class="text-gray-600 hover:text-gray-900 px-3 py-2 text-sm font-medium">Pricing</a>
                    </div>
                </div>
                <div class="flex items-center">
                    <div class="relative group">
                        <button class="flex items-center text-sm font-medium text-gray-700 hover:text-gray-900">
                            {{if .CurrentUser.Name.Valid}}{{.CurrentUser.Name.String}}{{else}}{{.CurrentUser.Email}}{{end}}
                        </button>
                        <div class="hidden group-hover:block absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-10">
                            <a href="/dashboard/general" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
                            <a href="/dashboard/activity" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Activity</a>
                            <hr class="my-1">
                            <a href="/sign-out" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Sign Out</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    {{end}}
    <main>{{template "content" .}}</main>
    <footer class="bg-white border-t mt-auto">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-sm text-gray-500">&copy; 2024 {{.AppName}}. All rights reserved.</p>
        </div>
    </footer>
    <script src="/js/app.js"></script>
</body>
</html>
{{end}}
