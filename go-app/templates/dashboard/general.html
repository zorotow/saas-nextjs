{{define "general.html"}}
{{template "layout" .}}
{{end}}

{{define "content"}}
<div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
    {{if .Success}}<div class="mb-4 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded">Account updated successfully.</div>{{end}}
    <div class="md:grid md:grid-cols-3 md:gap-6">
        <div class="md:col-span-1">
            <h3 class="text-lg font-medium leading-6 text-gray-900">General Settings</h3>
            <p class="mt-1 text-sm text-gray-600">Update your account information.</p>
            <nav class="mt-5 space-y-1">
                <a href="/dashboard/general" class="bg-orange-50 border-orange-500 text-orange-700 block pl-3 pr-4 py-2 border-l-4 text-sm font-medium">General</a>
                <a href="/dashboard/security" class="border-transparent text-gray-600 hover:bg-gray-50 block pl-3 pr-4 py-2 border-l-4 text-sm font-medium">Security</a>
                <a href="/dashboard/activity" class="border-transparent text-gray-600 hover:bg-gray-50 block pl-3 pr-4 py-2 border-l-4 text-sm font-medium">Activity</a>
            </nav>
        </div>
        <div class="mt-5 md:mt-0 md:col-span-2">
            <form action="/dashboard/general" method="POST">
                <div class="shadow sm:rounded-md sm:overflow-hidden">
                    <div class="px-4 py-5 bg-white space-y-6 sm:p-6">
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                            <input type="text" name="name" id="name" value="{{if .User.Name.Valid}}{{.User.Name.String}}{{end}}" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md" required>
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
                            <input type="email" name="email" id="email" value="{{.User.Email}}" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md" required>
                        </div>
                    </div>
                    <div class="px-4 py-3 bg-gray-50 text-right sm:px-6">
                        <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-orange-600 hover:bg-orange-700">Save</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{{end}}
