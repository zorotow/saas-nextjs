{% extends "layout.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full text-center">
        <h1 class="text-9xl font-extrabold text-gray-200">404</h1>
        <h2 class="mt-4 text-3xl font-bold text-gray-900">Page not found</h2>
        <p class="mt-2 text-gray-600">Sorry, we couldn't find the page you're looking for.</p>
        <div class="mt-6">
            <a href="{{ url_for('index') }}" class="text-orange-600 hover:text-orange-500 font-medium">Go back home <span aria-hidden="true">&rarr;</span></a>
        </div>
    </div>
</div>
{% endblock %}
