{{define "pricing.html"}}
{{template "layout" .}}
{{end}}

{{define "content"}}
<div class="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
    <div class="text-center">
        <h2 class="text-3xl font-extrabold text-gray-900 sm:text-4xl">Simple, transparent pricing</h2>
        <p class="mt-4 text-xl text-gray-600">Choose the plan that's right for you</p>
    </div>
    <div class="mt-12 space-y-4 sm:mt-16 sm:space-y-0 sm:grid sm:grid-cols-2 sm:gap-6 lg:max-w-4xl lg:mx-auto xl:max-w-none xl:grid-cols-3">
        <div class="border border-gray-200 rounded-lg shadow-sm divide-y divide-gray-200 bg-white">
            <div class="p-6">
                <h3 class="text-lg leading-6 font-medium text-gray-900">Free</h3>
                <p class="mt-4 text-sm text-gray-500">Perfect for getting started</p>
                <p class="mt-8"><span class="text-4xl font-extrabold text-gray-900">$0</span><span class="text-base font-medium text-gray-500">/mo</span></p>
                <a href="/sign-up" class="mt-8 block w-full bg-gray-100 border border-gray-300 rounded-md py-2 text-sm font-semibold text-gray-900 text-center hover:bg-gray-200">Get started</a>
            </div>
        </div>
        <div class="border border-orange-500 rounded-lg shadow-sm divide-y divide-gray-200 bg-white">
            <div class="p-6">
                <h3 class="text-lg leading-6 font-medium text-gray-900">Base</h3>
                <p class="mt-4 text-sm text-gray-500">For small teams</p>
                <p class="mt-8"><span class="text-4xl font-extrabold text-gray-900">$8</span><span class="text-base font-medium text-gray-500">/mo</span></p>
                <a href="/sign-up" class="mt-8 block w-full bg-orange-600 border border-transparent rounded-md py-2 text-sm font-semibold text-white text-center hover:bg-orange-700">Subscribe</a>
            </div>
        </div>
        <div class="border border-gray-200 rounded-lg shadow-sm divide-y divide-gray-200 bg-white">
            <div class="p-6">
                <h3 class="text-lg leading-6 font-medium text-gray-900">Plus</h3>
                <p class="mt-4 text-sm text-gray-500">For growing teams</p>
                <p class="mt-8"><span class="text-4xl font-extrabold text-gray-900">$12</span><span class="text-base font-medium text-gray-500">/mo</span></p>
                <a href="/sign-up" class="mt-8 block w-full bg-gray-800 border border-transparent rounded-md py-2 text-sm font-semibold text-white text-center hover:bg-gray-900">Subscribe</a>
            </div>
        </div>
    </div>
</div>
{{end}}
